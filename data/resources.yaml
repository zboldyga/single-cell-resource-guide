      are editorial synthesis. Unknown metadata remains explicit.
  related:
  - pdb
  key_data:
  - 'Monomer and complex models: Predicted 3D coordinates for UniProt single-chain proteins plus high-confidence
    and bulk lower-confidence homodimers, heterodimers, and viral complexes.'
  - 'Local confidence (pLDDT): Per-residue scores (0 to 100) assessing local structural reliability; low
    values reflect either intrinsic disorder or model uncertainty.'
  - 'Domain and interface error (PAE): Pairwise Predicted Aligned Error matrices quantifying inter-residue,
    inter-domain, and inter-chain positional uncertainty in Angstroms.'
  - 'Functional and variant annotations: Residue-level cross-references to UniProt features, InterPro
    domains, and human AlphaMissense single-substitution pathogenicity predictions.'
- id: biogrid
  name: BioGRID
  url: https://thebiogrid.org/
  purpose: Literature-curated archive of experimentally observed physical protein interactions, genetic
    interactions, post-translational modification sites, and chemical-target associations across human
    and model organisms.
  question: Which physical binding partners, synthetic-lethal genetic interactors, or modifying enzymes
    are experimentally reported for my target gene in primary literature?
  categories:
  - Pathways & interactions
  modalities:
  - Protein interactions
  - Genetic interactions
  - Post-translational modifications
  - Drug-target annotations
  species:
  - Homo sapiens
  - Saccharomyces cerevisiae
  - Schizosaccharomyces pombe
  - Arabidopsis thaliana
  - Other model organisms
  biological_scope: Experimentally reported interactions curated from primary literature across human,
    yeast, mouse, fly, worm, plant, and viral pathogens, with companion CRISPR screen indexing in BioGRID-ORCS.
  granularity:
  - Gene pair
  - Protein pair
  - Modification site
  resource_type: aggregator
  maintainer: BioGRID project
  scale:
    summary: About 2.36 million non-redundant interactions in the October 1, 2026 release announcement.
    as_of: '2026-10-01'
    source_url: https://thebiogrid.org/
  release:
    label: 5.0.262
    date: '2026-10-01'
    source_url: https://thebiogrid.org/
    note: Dated substantive release announcement; downloads were compiled September 25, 2026.
  access:
    web:
      status: 'yes'
      url: https://thebiogrid.org/
      note: Official browser or resource landing page.
    api:
      status: 'yes'
      url: https://wiki.thebiogrid.org/doku.php/biogridrest
      note: REST service requires an application access key.
    bulk:
      status: 'yes'
      url: https://downloads.thebiogrid.org/BioGRID/Latest-Release/
      note: Complete and organism-specific interaction files; use current formats.
  download_examples:
  - label: Download the latest all-organism interaction table
    description: Downloads the complete BioGRID interaction archive in TAB3 format for all included organisms.
      This can be substantially larger than a species-specific selection; the LATEST target changes each
      release.
    command: |-
      curl --fail --location --retry 3 \
        --output BIOGRID-ALL-LATEST.tab3.zip \
        https://downloads.thebiogrid.org/Download/BioGRID/Latest-Release/BIOGRID-ALL-LATEST.tab3.zip
    requirements:
    - curl. Run in a fresh working directory and check the provider’s file size before transferring.
    source_url: https://downloads.thebiogrid.org/BioGRID/Latest-Release/
    checked_on: '2026-10-22'
  licensing:
    summary: MIT License for downloadable BioGRID data.
    source_url: https://downloads.thebiogrid.org/BioGRID/Latest-Release/
  not_for: Genetic interaction edges capture phenotypic epistasis rather than physical binding, and pooled
    literature records merge heterogeneous cell lines and overexpression assays without guaranteeing interaction
    in your cell state.
  sources:
  - url: https://wiki.thebiogrid.org/doku.php/aboutus
    title: About BioGRID
