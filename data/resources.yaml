      note: Not verified
    bulk:
      status: 'yes'
      url: https://www.ncbi.nlm.nih.gov/sra/docs/sradownload/
      note: SRA Toolkit retrieves run lists; converts to FASTQ or SAM
  download_examples:
  - label: Download one public run and convert to FASTQ
    description: Prompts for one public SRR, ERR, or DRR run accession. The download is capped at 2 GB;
      conversion can need roughly 17 times the archive size in total working space. This processes an entire
      run, rather than a cell matrix or a study-wide run list.
    command: |-
      (
        set -e
        read -r -p 'Public SRA run accession (SRR/ERR/DRR): ' sra_run
        if [[ "$sra_run" =~ ^(SRR|ERR|DRR)[0-9]+$ ]]; then
          vdb-dump "$sra_run" --info && \
          prefetch "$sra_run" --max-size 2G -O "./$sra_run" && \
          fasterq-dump "$sra_run" --split-files --threads 4
        else
          printf '%s\n' 'Enter a single SRR, ERR, or DRR run accession.' >&2
        fi
      )
    requirements:
    - Bash and the NCBI SRA Toolkit (vdb-dump, prefetch, fasterq-dump) installed and configured.
    - Choose a public sequencing run and use an empty working directory. Protected runs require authorized
      access.
    - Review the run size shown by vdb-dump and reserve conversion/scratch space; the 2 GB limit intentionally
      stops larger archives.
    source_url: https://github.com/ncbi/sra-tools/wiki/08.-prefetch-and-fasterq-dump
    checked_on: '2026-10-22'
  licensing:
    summary: Public submissions are accessible; protected human datasets require dbGaP access. Dataset
      reuse terms were not fully audited.
    source_url: https://www.ncbi.nlm.nih.gov/sra/docs/
  not_for: Raw read archive requiring compute-intensive alignment or barcode demultiplexing; secondary
    run-level count tables do not provide cell-by-gene single-cell matrices, and sample perturbation labels
    are often unstructured.
