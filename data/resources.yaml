  - reactome
  key_data:
  - 'Physical interactions: Literature-reported protein associations with assay codes, distinguishing
    affinity-capture or co-complex evidence from direct-binding assays.'
  - 'Genetic interactions: Epistatic and phenotypic modifier pairs including synthetic lethality, dosage
    rescue, and phenotypic enhancement or suppression.'
  - 'Study provenance: PubMed citations, organism taxonomy, directional bait-to-hit roles, quantitative
    scores where published, and low- versus high-throughput study flags.'
  - 'PTMs and chemicals: Curated post-translational modification sites linked to modifying enzymes alongside
    bioactive chemical-protein target interactions.'
- id: cell-ontology
  name: Cell Ontology (CL)
  url: https://obophenotype.github.io/cell-ontology/
  purpose: OBO Foundry reference ontology defining a directed acyclic graph of metazoan cell types, lineage
    relationships, and anatomical or functional axioms.
  question: Which standardized CL ontology term and lineage ancestor should I assign to my annotated single-cell
    clusters for integration with reference atlases?
  categories:
  - Archives & standards
  modalities:
  - Cell-type ontology
  - Ontology
  - Functional annotations
  species:
  - Metazoa
  biological_scope: Primarily in vivo, non-pathological metazoan (especially mammalian and vertebrate)
    cell types across tissues and developmental stages; excludes immortalized cell lines and patient-specific
    malignant neomorphic states.
  granularity:
  - Cell type
  - Ontology term
  resource_type: standard
  maintainer: Cell Ontology community (obophenotype)
  scale:
    summary: 3,325 subclasses of the root in the June 8, 2026 ontology release.
    as_of: '2026-06-08'
    source_url: https://github.com/obophenotype/cell-ontology/releases
  release:
    label: '2026-06-08'
    date: '2026-06-08'
    source_url: https://github.com/obophenotype/cell-ontology/releases
    note: Latest displayed ontology release; release notes enumerate content changes.
  access:
    web:
      status: 'yes'
      url: https://obophenotype.github.io/cell-ontology/
      note: Official browser or resource landing page.
    api:
      status: unknown
      url: null
      note: API availability not verified.
    bulk:
      status: 'yes'
      url: https://github.com/obophenotype/cell-ontology/releases
      note: Versioned ontology release files; main products include OWL/OBO/JSON.
  download_examples:
  - label: Download the Cell Ontology
    description: Downloads the current Cell Ontology in OWL format. This is the cell-type vocabulary, not
      a cell-expression reference; OWL tools may separately resolve imported ontologies.
    command: |-
      curl --fail --location --retry 3 \
        --output cl.owl \
        https://purl.obolibrary.org/obo/cl.owl
    requirements:
    - curl. Run in a fresh working directory and check the provider’s file size before transferring.
    source_url: https://obophenotype.github.io/cell-ontology/
    checked_on: '2026-10-22'
  licensing:
    summary: CC BY 4.0.
    source_url: https://obofoundry.org/ontology/cl.html
  not_for: Defines semantic cell-type concepts and lineage hierarchy rather than storing reference expression
    profiles or classifier weights; assigning a term still requires transcriptomic marker evidence from
    your dataset.
  sources:
  - url: https://obophenotype.github.io/cell-ontology/
