- id: tahoe-100m
  name: Tahoe-100M
  url: https://huggingface.co/datasets/tahoebio/Tahoe-100M
  purpose: Profiles single-cell transcriptional responses of 50 pooled human cancer cell lines across
    ~1,100 small-molecule drug-dose conditions and plate-matched controls using split-pool barcoding.
  question: How does a small-molecule drug at a given dose shift single-cell expression programs across
    50 cancer cell lines in pooled wells?
  categories:
  - Perturbation & dependencies
  - Disease & drug discovery
  modalities:
  - Single-cell RNA-seq
  - Drug perturbations
  - Functional genomics
  species:
  - Homo sapiens
  biological_scope: Fifty human cancer cell lines co-cultured in multiplexed cell villages and exposed
    to 379 small-molecule drugs across roughly 1,100 drug-dose conditions with plate-matched DMSO controls.
  granularity:
  - Cell
  - Cell line
  - Drug-dose condition
  resource_type: primary
  maintainer: Tahoe Therapeutics; Arc Institute distributes an additional data copy
  scale:
    summary: Initial public release described about 100 million cells across 50 cancer cell lines; file
      representations and filtering differ.
    as_of: '2025-02-25'
    source_url: https://arcinstitute.org/news/arc-virtual-cell-atlas-launch
  release:
    label: unknown
    date: null
    source_url: null
    note: Initial public availability on 2025-02-25 is documented; latest substantive dataset revision
      is unknown. The 2026 paper date is not a data-release date.
  access:
    web:
      status: 'yes'
      url: https://huggingface.co/datasets/tahoebio/Tahoe-100M
      note: Browse official resource.
    api:
      status: 'yes'
      url: https://huggingface.co/datasets/tahoebio/Tahoe-100M
      note: Official card documents programmatic loading/streaming with the Hugging Face datasets library;
        this is file access, not a biological query REST API.
    bulk:
      status: 'yes'
      url: https://huggingface.co/datasets/tahoebio/Tahoe-100M
      note: Parquet files via Hugging Face; Arc also distributes h5ad data, with its current Google Cloud
        copy subject to Requester Pays and Marketplace setup.
  download_examples:
  - label: Download sample metadata
    description: Downloads the sample-level metadata Parquet file (about 65.6 kB) from the official Tahoe-100M
      distribution. This provides condition metadata, rather than single-cell expression counts.
    command: |-
      curl --fail --location --output sample_metadata.parquet \
        'https://huggingface.co/datasets/tahoebio/Tahoe-100M/resolve/main/metadata/sample_metadata.parquet'
    requirements:
    - curl and a fresh working directory.
    - A Parquet reader is needed to inspect the downloaded table. The main branch may change; record its
      revision for reproducible work.
    source_url: https://huggingface.co/datasets/tahoebio/Tahoe-100M/blob/main/metadata/sample_metadata.parquet
    checked_on: '2026-10-22'
  - label: Download one expression shard
    description: Downloads only data/train-00000-of-03388.parquet (about 71.2 MB) from the official distribution.
      This is a file shard, rather than a biologically selected subset or the full 338 GB expression-data
      directory; retain the matching metadata for interpretation.
    command: |-
      hf download tahoebio/Tahoe-100M \
        data/train-00000-of-03388.parquet \
        --repo-type dataset --local-dir tahoe-100m
    requirements:
    - The Hugging Face hf CLI installed; its download syntax is documented at https://huggingface.co/docs/huggingface_hub/guides/cli
      .
    - A Parquet reader and matching Tahoe gene/sample/cell-line metadata for analysis.
    - Allow at least the displayed file size in local storage; main is mutable, so record or pin a revision
      for reproducibility.
    source_url: https://huggingface.co/datasets/tahoebio/Tahoe-100M/tree/main/data
    checked_on: '2026-10-22'
  licensing:
    summary: Official Hugging Face dataset card labels this distribution CC0-1.0; cloud transfer costs
      are separate from data licensing.
    source_url: https://huggingface.co/datasets/tahoebio/Tahoe-100M
  not_for: Perturbations are strictly small-molecule compounds applied to immortalized cancer cell lines
    in vitro; does not include genetic CRISPR knockouts or primary non-malignant human tissues.
