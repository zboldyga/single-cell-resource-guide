    description: On the gnomAD downloads page, choose the desired release and constraint table, then copy
      its public HTTPS file link. Downloads that table only; genome-wide variant VCFs and Hail tables are
      separate, much larger products.
    command: |-
      (
        set -e
        read -r -p 'Paste the public gnomAD constraint-table HTTPS URL: ' gnomad_url
        curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --remote-name "$gnomad_url"
