  related:
  - cellxgene
  - gene-ontology
  key_data:
  - 'Cell-type terms: Stable CL identifiers paired with textual definitions, exact and broad synonyms,
    and curated marker or phenotypic notes.'
  - 'Lineage hierarchy: Subtype classifications and ontogenic lineage edges linking stem and progenitor
    populations to differentiated somatic and immune cell states.'
  - 'Cross-ontology axioms: Logical links connecting cell types to Uberon anatomical structures, Gene
    Ontology biological processes, and phenotypic qualities.'
- id: chembl
  name: ChEMBL
  url: https://www.ebi.ac.uk/chembl/
  purpose: Curates quantitative small-molecule bioactivities, standardized chemical structures, and experimental
    assay parameters from medicinal chemistry literature, patents, and deposited screens.
  question: Which tool compounds or clinical molecules potently modulate my protein target in direct binding
    versus cell-based functional assays, and at what concentrations?
  categories:
  - Disease & drug discovery
  modalities:
  - Bioactivity assays
  - Chemical structures
  - Drug-target annotations
  - Drug annotations
  species:
  - Homo sapiens
  - Mus musculus
  - Rattus norvegicus
  - Other species
  biological_scope: Bioactive small molecules, peptides, and biotherapeutics tested against recombinant
    proteins, complexes, cell lines, and organisms across human, rodent, and microbial targets.
  granularity:
  - Compound
  - Assay
  - Target
  - Cell line
  resource_type: aggregator
  maintainer: EMBL-EBI ChEMBL team
  scale:
    summary: unknown
    as_of: null
    source_url: null
  release:
    label: ChEMBL 37
    date: null
    source_url: https://chembl.gitbook.io/chembl-interface-documentation/downloads
    note: Official downloads page lists May 2026; exact release day not verified.
  access:
    web:
      status: 'yes'
      url: https://www.ebi.ac.uk/chembl/
      note: Search and browse official records
    api:
      status: 'yes'
      url: https://chembl.gitbook.io/chembl-interface-documentation/web-services/chembl-data-web-services
      note: REST resources for compounds, assays, activities and targets
    bulk:
      status: 'yes'
      url: https://chembl.gitbook.io/chembl-interface-documentation/downloads
      note: Database dumps plus structure and sequence files
  download_examples:
  - label: Download a selected ChEMBL release file
    description: Choose a release file from the official directory, then paste its HTTPS link. SQLite, PostgreSQL,
      and MySQL archives contain the database; SDF and FASTA exports have narrower contents. Review the
      size before selecting a full database archive.
    command: |-
      (
        read -r -p 'Paste the direct HTTPS file URL: ' download_url &&
        curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
          --remote-name "$download_url"
      )
    requirements:
    - Bash and curl. Copy an individual file link, not a web page or directory. Use a fresh working directory
      with enough free space for your selection.
    source_url: https://chembl.gitbook.io/chembl-interface-documentation/downloads
    checked_on: '2026-10-22'
  licensing:
    summary: Database provided under CC BY-SA 3.0.
    source_url: https://www.ebi.ac.uk/chembl/
  not_for: Literature-extracted biochemical and phenotypic endpoints lack genome-wide transcriptomic readouts;
    unfiltered queries easily conflate nonspecific whole-cell cytotoxicity with direct target engagement.
