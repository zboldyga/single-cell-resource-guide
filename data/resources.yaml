- id: string
  name: STRING
  url: https://string-db.org/
  purpose: Probabilistic protein association network integrating physical interaction assays, curated
    pathways, co-expression, literature mining, and genomic context into calibrated confidence scores
    across organisms.
  question: Do candidate genes from my perturbation or single-cell module form physical complexes or functional
    modules, and which evidence channels support each edge?
  categories:
  - Pathways & interactions
  modalities:
  - Protein association networks
  - Protein interactions
  - Macromolecular complexes
  - Functional annotations
  species:
  - Multiple species
  biological_scope: Proteome-wide networks across thousands of eukaryotic, prokaryotic, and viral organisms,
    integrating experimental interactomes, pathway databases, co-expression, and comparative genomic evidence.
  granularity:
  - Protein
  - Protein pair
  resource_type: aggregator
  maintainer: STRING Consortium
  scale:
    summary: About 59.3 million proteins across 12,535 organisms in v12.5.
    as_of: '2026-09-29'
    source_url: https://www.string-db.org/cgi/access
  release:
    label: '12.5'
    date: '2026-09-29'
    source_url: https://www.string-db.org/cgi/access
    note: Version-history start date for the current substantive network release.
  access:
    web:
      status: 'yes'
      url: https://string-db.org/
      note: Official browser or resource landing page.
    api:
      status: 'yes'
      url: https://www.string-db.org/cgi/access
      note: REST API documented; use bulk downloads for large networks.
    bulk:
      status: 'yes'
      url: https://www.string-db.org/cgi/access
      note: Official access page links the bulk download service.
  download_examples:
  - label: Download the human STRING v12.5 network
    description: Downloads the human (taxon 9606) protein-links network with combined scores. This is the
      functional-association network, not the physical-only network or evidence-channel detail file.
    command: |-
      curl --fail --location --retry 3 \
        --output 9606.protein.links.v12.5.txt.gz \
        https://stringdb-downloads.org/download/protein.links.v12.5/9606.protein.links.v12.5.txt.gz
    requirements:
    - curl. Run in a fresh working directory and check the provider’s file size before transferring.
    source_url: https://string-db.org/cgi/download
    checked_on: '2026-10-22'
  licensing:
    summary: 'STRING data and outputs: CC BY 4.0; incorporated external material retains its provider’s
      terms.'
    source_url: https://www.string-db.org/cgi/access
  not_for: Functional association is not direct binding or causal direction. Even physical-network edges
    may mean shared complex membership; inspect evidence channels and organism-specific support.
