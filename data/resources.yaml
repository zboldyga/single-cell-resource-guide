  related: []
  key_data:
  - 'Bioactivity endpoints: Quantitative dose-response metrics and single-concentration readouts categorized
    into direct binding, functional, and ADMET assay types.'
  - 'Target confidence: Explicit confidence scores distinguishing assigned single protein targets from
    protein complexes, protein families, or whole-cell phenotypic assays.'
  - 'Chemical properties: Standardized 2D chemical structures, physicochemical descriptors, structural
    alerts, and curated mechanisms of action for clinical and tool molecules.'
  - 'Assay provenance: Curated target organism, UniProt accession, mutant status, cell or tissue context,
    and source publication or patent identifiers.'
- id: clinvar
  name: ClinVar
  url: https://www.ncbi.nlm.nih.gov/clinvar/
  purpose: Archives submitter-reported clinical and functional classifications of human variants across
    germline, somatic, and pharmacogenomic contexts while tracking review levels and conflicts.
  question: Have clinical laboratories or expert panels classified this human variant as pathogenic or
    oncogenic, and do independent submitters agree?
  categories:
  - Disease & drug discovery
  - Genes & genomes
  modalities:
  - Variant classifications
  - Clinical annotations
  - Clinical evidence
  - Genetic associations
  species:
  - Homo sapiens
  biological_scope: Human germline and somatic sequence, structural, and copy-number variants evaluated
    for Mendelian disorders, hereditary or somatic cancers, and pharmacogenomic phenotypes.
  granularity:
  - Variant
  - Variant-condition assertion
  resource_type: aggregator
  maintainer: NCBI, US National Library of Medicine
  scale:
    summary: unknown
