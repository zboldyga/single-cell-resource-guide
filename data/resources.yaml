schema_version: '1.0'
title: Single-Cell Resource Guide
updated_at: '2026-10-22'
resources:
- id: alphafold-db
  name: AlphaFold Protein Structure Database
  url: https://alphafold.ebi.ac.uk/
  purpose: Public repository of AlphaFold-predicted 3D atomic coordinates and confidence metrics for monomeric
    proteins alongside selected homodimeric, heterodimeric, and viral protein complexes.
  question: What is the predicted 3D fold or dimer interface for my protein, and are key residues modeled
    with high confidence?
  categories:
  - Proteins & structures
  modalities:
  - Predicted structures
  - Macromolecular complexes
  - Protein sequences
  - Variant classifications
  species:
  - Multiple species
  biological_scope: Canonical single-chain proteins across UniProt reference proteomes and Swiss-Prot,
    plus expanded 2026 collections of predicted homodimers, heterodimers, and viral protein complexes
    without bound nucleic acids or small-molecule ligands.
  granularity:
  - Protein
  - Residue
  - Structure
  - Protein complex
  resource_type: primary
  maintainer: Google DeepMind and EMBL-EBI
  scale:
    summary: unknown
    as_of: null
    source_url: null
  release:
    label: unknown
    date: null
    source_url: null
    note: Latest substantive data release not verified.
  access:
    web:
      status: 'yes'
      url: https://alphafold.ebi.ac.uk/
      note: Official browser or resource landing page.
    api:
      status: unknown
      url: null
      note: Official API documentation page was found, but its contents could not be inspected.
    bulk:
      status: 'yes'
      url: https://alphafold.ebi.ac.uk/download
      note: Proteome and selected collaborator archives; individual predictions downloadable from structure
        pages.
  download_examples:
  - label: Download one selected structure
    description: Open an AlphaFold DB structure entry and copy its mmCIF download link. This downloads that
      one prediction, rather than an entire species proteome or complex collection.
    command: |-
      (
        set -e
        read -r -p 'Paste the structure’s mmCIF file download URL: ' alphafold_cif_url
        curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output selected-model.cif "$alphafold_cif_url"
      )
    requirements:
    - Bash and curl.
    - Select an individual model’s mmCIF file link; do not paste the entry page URL.
    - Use a fresh working directory and retain the entry identifier/version plus confidence data when interpreting
      the model.
    source_url: https://alphafold.ebi.ac.uk/download
    checked_on: '2026-10-22'
  licensing:
    summary: CC BY 4.0 for downloadable data; cite the relevant prediction dataset.
    source_url: https://alphafold.ebi.ac.uk/download
  not_for: Predictions are not experimental structures. Complex coverage remains incomplete, and confidence
    scores do not establish binding, activity, or a unique cellular conformation; inspect local and interface
    uncertainty.
  sources:
  - url: https://alphafold.ebi.ac.uk/about
    title: About AlphaFold DB
    type: official
    checked_on: '2026-10-22'
